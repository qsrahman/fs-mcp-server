# Runs the checks on every push to main and on pull requests, so a problem
# shows up before a release tag is pushed. release.yml repeats them on release.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        node-version: [22, 24] # package.json engines: >=22
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        # the version comes from devEngines.packageManager in package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          package-manager-cache: false

      - run: pnpm install --frozen-lockfile
      - run: pnpm validate # builds, type-checks, tests and checks formatting

      # Fails below the floor in vitest.config.ts. Once is enough, and the
      # numbers do not differ by Node version.
      - run: pnpm test:coverage
        if: matrix.node-version == 24
