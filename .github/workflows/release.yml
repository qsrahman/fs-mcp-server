# Publishes @qsrahman/fs-mcp-server to npm when a version tag (v*) is pushed.
# Run it by hand (Actions tab, or `gh workflow run release.yml`) for a dry run
# that does everything except the upload.
#
# Publishing uses npm trusted publishing (OIDC): no npm token is stored. It
# needs a one-time setup on npmjs.com, described in AGENTS.md ("Publishing").
# The workflow file must stay named release.yml, because npm checks the name.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Jobs get read access to the repository and nothing else unless they ask.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Runs the repository's own code (install, tests, build). It has no publish
  # rights, so a compromised dependency cannot publish.
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the "tag is on main" check below needs history
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        # the version comes from devEngines.packageManager in package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      # A tag must be vX.Y.Z for the version in package.json, and must point at
      # a commit that is on main, so a stray tag cannot publish.
      - name: Check the tag
        if: github.event_name == 'push'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Tag $TAG does not match package.json version $version"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $TAG is not on main"
            exit 1
          fi

      - run: pnpm install --frozen-lockfile

      - name: Typecheck, test, format check
        run: pnpm validate

      - run: pnpm build

      - name: Pack
        run: |
          mkdir -p "$RUNNER_TEMP/pkg"
          pnpm pack --pack-destination "$RUNNER_TEMP/pkg"
          ls -l "$RUNNER_TEMP/pkg"

      # The package ships only compiled files; fail if the tarball is not that.
      - name: Check the tarball
        run: |
          set -eu
          tarball=$(ls "$RUNNER_TEMP"/pkg/*.tgz)
          tar -tzf "$tarball" | tee "$RUNNER_TEMP/files.txt"
          if ! grep -qx 'package/dist/index.js' "$RUNNER_TEMP/files.txt"; then
            echo "::error::dist/index.js is missing from the tarball"
            exit 1
          fi
          # (a negated grep would not fail the step under set -e, so test explicitly)
          if grep -E '^package/(src|tests|\.github)/|\.map$' "$RUNNER_TEMP/files.txt"; then
            echo "::error::the tarball contains files that should not ship"
            exit 1
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: ${{ runner.temp }}/pkg/*.tgz
          if-no-files-found: error
          retention-days: 7

  # Publishes exactly the tarball that was tested. It is the only job with
  # id-token: write, and it runs no code from the repository: there is no
  # checkout, only the tarball and the npm CLI.
  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm # add required reviewers to this environment for a manual approval step
    permissions:
      contents: read
      id-token: write # lets npm exchange a GitHub OIDC token for publish rights
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
          path: ${{ runner.temp }}/dl

      # Trusted publishing needs npm 11.5.1 or newer.
      - name: Check the npm version
        run: |
          v=$(npm --version)
          echo "npm $v"
          if [ "$(printf '%s\n' 11.5.1 "$v" | sort -V | head -n1)" != "11.5.1" ]; then
            echo "::error::npm $v is older than 11.5.1, which trusted publishing needs"
            exit 1
          fi

      - name: Publish
        env:
          # a manual run only rehearses: --dry-run stops before the upload
          DRY_RUN: ${{ github.event_name != 'push' && '--dry-run' || '' }}
        working-directory: ${{ runner.temp }}/dl
        run: |
          set -eu
          tarball=$(ls ./*.tgz)
          id=$(tar -xzOf "$tarball" package/package.json | node -p 'const p = JSON.parse(require("fs").readFileSync(0, "utf8")); p.name + "@" + p.version')
          # npm refuses an existing version even for --dry-run, so a rehearsal on
          # a released version would always end red. A real publish of one still fails.
          if [ -n "$DRY_RUN" ] && npm view "$id" version > /dev/null 2>&1; then
            echo "::notice::$id is already on npm, so there is nothing to rehearse. Bump the version to rehearse the upload."
            exit 0
          fi
          npm publish "$tarball" --access public $DRY_RUN # DRY_RUN is empty or one flag
